name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate (Fail-Fast Static Checks & Linting)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@7981788eea94e3a37cb5e24d4d30a07b1bc0bab4 # v0.13.0
        with:
          sync-args: "--all-extras --dev"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  # =========================================================================
  # Cluster Reachability & Health Probe (Optional Compute Fleet Offloading)
  # =========================================================================
  cluster-probe:
    name: Cluster Reachability & Health Probe
    runs-on: ubuntu-latest
    outputs:
      cluster_ready: ${{ steps.probe.outputs.cluster_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Probe Hexaqueue Cloud Fleet
        id: probe
        uses: TheTrueSCU/hexaqueue@1e7b3c4625c82bece17dbc9eafc72664e4bd501c # v0.12.1
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          version: ">=0.12.1"
          probe-only: "true"
          step-summary: "true"

  # =========================================================================
  # Stage 2: Unit / Integration Tests & Code Coverage
  # Only executes if Stage 1 static quality checks succeed
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Unit & Integration Tests
        run: uv run hexaqual test run -U --cov=src/hexaflow --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: junit.xml

  # =========================================================================
  # Stage 3: Invariant & Hypothesis Fuzzing
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Hypothesis Fuzzing
        run: uv run hexaqual test run -P

  plan-mutations:
    name: Plan Mutation Slices
    needs: [test-suite, cluster-probe]
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_affected: ${{ steps.plan.outputs.has_affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Plan AST-Weighted Changed Mutation Slices
        id: plan
        uses: TheTrueSCU/hexaqual/.github/actions/mutate-plan@7981788eea94e3a37cb5e24d4d30a07b1bc0bab4 # v0.13.0
        with:
          mode: changed-slices
          base-ref: ${{ github.base_ref }}
          root: src/hexaflow
          slices: "8"
          max-weight: "450"

  mutation-verification:
    name: Mutation Testing (${{ matrix.name }})
    needs: [plan-mutations, cluster-probe]
    if: github.event_name == 'pull_request' && needs.plan-mutations.outputs.has_affected == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-mutations.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        uses: TheTrueSCU/hexaqueue@1e7b3c4625c82bece17dbc9eafc72664e4bd501c # v0.12.1
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          version: ">=0.12.1"
          auto-tunnel: "true"
          step-summary: "false"

      - name: Run Mutation Testing via Hexaqueue Cloud
        if: needs.cluster-probe.outputs.cluster_ready == 'true'
        env:
          HEXAQUEUE_TIMEOUT: "3300"
          HEXAQUEUE_RUN_ID_FILE: ${{ runner.temp }}/hexaqueue-active-run.id
        run: uv run hexaqual mutate run --targets "${{ matrix.targets }}" -e gremlins -w auto --batch-size 10 -n auto --cluster hexaqueue

      - name: Run Mutation Testing Locally (Fallback)
        if: needs.cluster-probe.outputs.cluster_ready != 'true'
        run: uv run hexaqual mutate run --targets "${{ matrix.targets }}" -e gremlins -w auto --batch-size 10 -n auto

      - name: Cancel Orphaned Hexaqueue Mutation Run (On Failure/Cancel)
        if: (cancelled() || failure()) && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: python3 .github/scripts/cancel_orphaned_workload.py --kind run --id-file "${{ runner.temp }}/hexaqueue-active-run.id"

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && needs.cluster-probe.outputs.cluster_ready == 'true'
        run: uv run hq cluster tunnel --stop || true

  # =========================================================================
  # Stage 4: Unified CI Success Status Check (Branch Protection Gate)
  # Aggregates results of all upstream stages, handling skipped conditional jobs
  # =========================================================================
  ci-success:
    name: CI Success (All Required Checks)
    needs:
      - quality-gate
      - cluster-probe
      - test-suite
      - hypothesis-fuzzing
      - mutation-verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: always()
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always()
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: always()
        run: uv sync --all-extras --all-groups

      - name: Generate CI Duration Breakdown & Trend Chart
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run hexaqual gh ci-duration --workflow CI --branch main --summary --pr "${{ github.event.pull_request.number }}" || true

      - name: Verify All Upstream Jobs Succeeded or Skipped
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Pre-Commit Quality Gate:      ${{ needs.quality-gate.result }}"
          echo "  Unit & Integration Tests:     ${{ needs.test-suite.result }}"
          echo "  Property-Based Fuzzing:       ${{ needs.hypothesis-fuzzing.result }}"
          echo "  Mutation Testing:             ${{ needs.mutation-verification.result }}"

          results=(
            "${{ needs.quality-gate.result }}"
            "${{ needs.test-suite.result }}"
            "${{ needs.hypothesis-fuzzing.result }}"
            "${{ needs.mutation-verification.result }}"
          )

          for res in "${results[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "🎉 All required CI jobs completed successfully (or were cleanly skipped)."
