name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-mutations:
    name: Plan Mutation Slices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_affected: ${{ steps.plan.outputs.has_affected }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Plan AST-Weighted Mutation Slices
        id: plan
        uses: TheTrueSCU/hexaqual/.github/actions/mutate-plan@6117ce25b1d39768f22396a55d13103abee88926 # v0.12.1
        with:
          mode: slices
          root: src/hexaflow
          slices: "8"
          max-weight: "450"

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

  mutation-audit:
    name: Mutation Audit (${{ matrix.name }})
    needs: plan-mutations
    if: needs.plan-mutations.outputs.has_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-mutations.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Cluster Reachability & Health Probe
        id: cluster-probe
        continue-on-error: true
        env:
          HEXAQUEUE_ENV: ${{ secrets.HEXAQUEUE_ENV }}
        run: |
          if [ -z "$HEXAQUEUE_ENV" ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "Hexaqueue cluster secrets not configured - running locally"
            exit 0
          fi
          echo "status=healthy" >> "$GITHUB_OUTPUT"
          echo "Hexaqueue cluster credentials detected"

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: steps.cluster-probe.outputs.status == 'healthy'
        uses: TheTrueSCU/hexaqueue@1e7b3c4625c82bece17dbc9eafc72664e4bd501c # v0.12.1
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          version: ">=0.12.1"
          auto-tunnel: "true"
          step-summary: "false"

      - name: Execute Mutation Sweep
        env:
          HEXAQUEUE_TIMEOUT: "3300"
          HEXAQUEUE_RUN_ID_FILE: ${{ runner.temp }}/hexaqueue-active-run.id
        run: |
          CLUSTER_FLAGS=""
          if [ "${{ steps.cluster-probe.outputs.status }}" = "healthy" ]; then
            CLUSTER_FLAGS="--cluster hexaqueue"
          fi
          uv run hexaqual mutate run --targets "${{ matrix.targets }}" -e gremlins -w auto --batch-size 10 -n auto $CLUSTER_FLAGS

      - name: Cancel Orphaned Hexaqueue Mutation Run (On Failure/Cancel)
        if: (cancelled() || failure()) && steps.cluster-probe.outputs.status == 'healthy'
        run: python3 .github/scripts/cancel_orphaned_workload.py --kind run --id-file "${{ runner.temp }}/hexaqueue-active-run.id"

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && steps.cluster-probe.outputs.status == 'healthy'
        run: uv run hq cluster tunnel --stop || true

      - name: Generate Mutation Triage Summary
        if: always()
        run: |
          uv run hexaqual mutate inspect -s -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: mutation-audit-report-${{ matrix.name }}
          path: |
            .gremlins-cache/
            .mutmut-cache
          if-no-files-found: ignore
          retention-days: 14
