name: Scheduled Performance Benchmarks

on:
  schedule:
    - cron: "0 4 * * 0"  # 04:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Microbenchmark Suite Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/benchmark_scheduled.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Restore Benchmark History
        uses: actions/cache/restore@v6
        with:
          path: .benchmarks_history/
          key: benchmark-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            benchmark-history-${{ runner.os }}-

      - name: Run Microbenchmarks
        run: |
          uv run pytest tests/benchmarks -n 0 --benchmark-enable --benchmark-only --no-cov --benchmark-autosave --benchmark-json=benchmark_results.json

      - name: Generate Benchmark Summary & Latency Trend Charts
        if: always()
        run: |
          uv run hexaqual test benchmark-report --results benchmark_results.json --history .benchmarks_history/history.json --summary || true

      - name: Save Benchmark History
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .benchmarks_history/
          key: benchmark-history-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30
