name: Coverage-Guided & Security Fuzzing

on:
  schedule:
    - cron: "0 2 * * 0"  # 02:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of fuzzing runs per harness"
        required: false
        default: "5000"
        type: string

permissions: read-all

jobs:
  fuzz:
    name: Atheris & OWASP Security Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/fuzz.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies & Atheris
        run: |
          uv sync --all-extras --all-groups
          uv pip install atheris

      - name: Execute Coverage-Guided & OWASP Fuzzing
        run: |
          RUNS="${{ github.event.inputs.runs || '5000' }}"
          uv run hexaqual test fuzz --target all --runs "$RUNS" --engine auto || true

      - name: Execute Full Property-Based State Machine Fuzzing
        run: uv run hexaqual test run -P --no-cov
