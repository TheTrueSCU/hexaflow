[project]
name = "hexaflow"
version = "0.0.0"
description = "Lightweight, embeddable Python workflow engine with stages, steps, splits, joins, and checkpointed resumption."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/TheTrueSCU/hexaflow"
Repository = "https://github.com/TheTrueSCU/hexaflow"
Documentation = "https://dopplereffect.us/hexaflow/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
