name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  # =========================================================================
  # Stage 1: Fast Quality Gate (Fail-Fast Static Checks & Linting)
  # =========================================================================
  quality-gate:
    name: Pre-Commit Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/ci.yml --summary --critical-path

      - name: Run Quality Gate via Hexaqual
        uses: TheTrueSCU/hexaqual@3fce1848698596b049df10bf01582207aed6e65a # v0.9.7
        with:
          sync-args: "--all-extras --dev"

      - name: Audit Repository Quality Gates
        run: uv run hexaqual sanity --audit-gates

      - name: Verify Documentation Consistency (Anti-Drift Linter)
        run: uv run hexaqual docs drift

  # =========================================================================
  # Stage 2: Unit / Integration Tests & Code Coverage
  # Only executes if Stage 1 static quality checks succeed
  # =========================================================================
  test-suite:
    name: Unit & Integration Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Unit & Integration Tests
        run: uv run hexaqual test run -U --cov=src/hexaflow --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: junit.xml

  # =========================================================================
  # Stage 3: Invariant & Hypothesis Fuzzing
  # Only executes on PRs if Unit & Integration test suite passed cleanly
  # =========================================================================
  hypothesis-fuzzing:
    name: Property-Based State Machine Fuzzing
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Hypothesis Fuzzing
        run: uv run hexaqual test run -P

  mutation-verification:
    name: Mutation Testing Verification
    needs: [test-suite]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Mutation Testing Verification
        run: uv run hexaqual mutate run -e gremlins -w auto --batch-size 10 -n auto

  # =========================================================================
  # Stage 4: Unified CI Success Status Check (Branch Protection Gate)
  # Aggregates results of all upstream stages, handling skipped conditional jobs
  # =========================================================================
  ci-success:
    name: CI Success (All Required Checks)
    needs:
      - quality-gate
      - test-suite
      - hypothesis-fuzzing
      - mutation-verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: always()
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: always()
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: always()
        run: uv sync --all-extras --all-groups

      - name: Generate CI Duration Breakdown & Trend Chart
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run hexaqual gh ci-duration --workflow CI --branch main --summary --pr "${{ github.event.pull_request.number }}" || true

      - name: Verify All Upstream Jobs Succeeded or Skipped
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  Pre-Commit Quality Gate:      ${{ needs.quality-gate.result }}"
          echo "  Unit & Integration Tests:     ${{ needs.test-suite.result }}"
          echo "  Property-Based Fuzzing:       ${{ needs.hypothesis-fuzzing.result }}"
          echo "  Mutation Testing:             ${{ needs.mutation-verification.result }}"

          results=(
            "${{ needs.quality-gate.result }}"
            "${{ needs.test-suite.result }}"
            "${{ needs.hypothesis-fuzzing.result }}"
            "${{ needs.mutation-verification.result }}"
          )

          for res in "${results[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::One or more upstream CI jobs failed or were cancelled."
              exit 1
            fi
          done

          echo "🎉 All required CI jobs completed successfully (or were cleanly skipped)."
