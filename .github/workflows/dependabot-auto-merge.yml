name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor updates: approve and enable auto-merge
      - name: Approve patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Categorize updates with labels
      - name: Label pull request
        run: |
          UPDATE_TYPE="${{ steps.meta.outputs.update-type }}"
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            gh pr edit "$PR_URL" --add-label "dependencies,major-update"
          elif [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            gh pr edit "$PR_URL" --add-label "dependencies,minor-update,automerge"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            gh pr edit "$PR_URL" --add-label "dependencies,patch-update,automerge"
          else
            gh pr edit "$PR_URL" --add-label "dependencies"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
