name: Scheduled Mutation Testing Audit

on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit:
    name: Mutation Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Visualize Pipeline DAG & Critical Path via Hexaflow
        if: always()
        run: |
          uvx --python 3.13 --from "hexaflow>=0.5.0" hexaflow graph render .github/workflows/mutation_scheduled.yml --summary --critical-path

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Cluster Reachability & Health Probe
        id: cluster-probe
        continue-on-error: true
        env:
          HEXAQUEUE_ENV: ${{ secrets.HEXAQUEUE_ENV }}
        run: |
          if [ -z "$HEXAQUEUE_ENV" ]; then
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
            echo "Hexaqueue cluster secrets not configured - running locally"
            exit 0
          fi
          echo "status=healthy" >> "$GITHUB_OUTPUT"
          echo "Hexaqueue cluster credentials detected"

      - name: Connect to Hexaqueue Cluster (Cloud Execution)
        if: steps.cluster-probe.outputs.status == 'healthy'
        uses: TheTrueSCU/hexaqueue@abe72e4be5cd26852a03a7da8a720e7b7e959a1a # v0.10.0
        with:
          cluster-env: ${{ secrets.HEXAQUEUE_ENV }}
          auto-tunnel: "true"
          step-summary: "false"

      - name: Execute Mutation Sweep
        env:
          HEXAQUEUE_TIMEOUT: "7200"
        run: |
          CLUSTER_FLAGS=""
          if [ "${{ steps.cluster-probe.outputs.status }}" = "healthy" ]; then
            CLUSTER_FLAGS="--cluster hexaqueue"
          fi
          uv run hexaqual mutate run -e gremlins -w auto --batch-size 10 -n auto $CLUSTER_FLAGS

      - name: Disconnect Hexaqueue Cluster Tunnel
        if: always() && steps.cluster-probe.outputs.status == 'healthy'
        run: uv run hq cluster tunnel --stop || true

      - name: Generate Mutation Triage Summary
        if: always()
        run: |
          uv run hexaqual mutate inspect -s -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Mutation Audit Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: mutation-audit-report
          path: |
            .gremlins-cache/
            .mutmut-cache
          retention-days: 14
