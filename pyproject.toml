[project]
name = "hexaflow"
version = "0.2.0"
description = "Lightweight, embeddable Python workflow engine with stages, steps, splits, joins, and checkpointed resumption."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Richard West", email = "dopplereffect.us@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/TheTrueSCU/hexaflow"
Repository = "https://github.com/TheTrueSCU/hexaflow"
Documentation = "https://dopplereffect.us/hexaflow/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hexaqual[all]>=0.2.0",
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"
]
ignore = ["E501", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["hexaflow"]

[project.scripts]
hexaflow = "hexaflow.cli.main:app"
hf = "hexaflow.cli.main:app"
