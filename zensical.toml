[project]
site_name = "Hexaflow"
site_description = "Lightweight, Embeddable Python Workflow Engine with Resumable DAG Execution"
site_url = "https://dopplereffect.us/hexaflow/"

nav = [
    { "Overview" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "Architecture & Design" = "architecture.md" },
    { "API & DSL Reference" = "api-reference.md" },
    { "Tutorials" = [
        { "Order Fulfillment Pipeline" = "tutorials/01-order-fulfillment-pipeline.md" }
    ]},
    { "Ecosystem Architecture" = "ecosystem.md" }
]

[project.markdown_extensions]
admonition = {}
tables = {}
toc = { permalink = true }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = { custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
] }
